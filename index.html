<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R0Y</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #canvas {
            max-width: 80%;
            max-height: 80vh;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <audio id="click-sound" src="fau.mp3"></audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clickSound = document.getElementById('click-sound');

        const img = new Image();
        img.src = './000000019199.jpg'; // Replace with your image path
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
        };

        canvas.addEventListener('click', () => {
            clickSound.play();
            shakeImage();
        });

        function shakeImage() {
            const shakeAmount = 7;
            const shakeDuration = 100;

            canvas.style.transform = `translate(${Math.random() * shakeAmount - shakeAmount/2}px, ${Math.random() * shakeAmount - shakeAmount/2}px)`;

            setTimeout(() => {
                canvas.style.transform = 'translate(0, 0)';
            }, shakeDuration);
        }
    </script>
</body>
</html>
